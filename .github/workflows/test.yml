name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Model.js unit tests
        run: node test/model.test.js
      - name: collector.py against throwaway repos
        # omarchy and gh are stubbed by the test, so nothing leaves the runner.
        run: python3 test/collector.test.py
